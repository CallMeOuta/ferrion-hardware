[[device]]
id = "chipset"
name = "q35 host bridge"
bus = "pci"
ids = ["8086:29c0"]
class = "060000"
route = "firmware"

[[device]]
id = "ps2"
name = "PS/2 keyboard and pointer"
bus = "platform"
route = "native"
driver = "ps2d"
stage = "initfs"

[[device]]
id = "serial"
name = "16550 serial console"
bus = "platform"
route = "firmware"

[[device]]
id = "sound"
name = "HDA sound"
bus = "pci"
ids = ["8086:293e"]
class = "040300"
route = "native"
driver = "ihdad"
stage = "rootfs"

[[device]]
id = "usb"
name = "qemu-xhci (no USB device attached)"
bus = "pci"
ids = ["1b36:000d"]
class = "0c0330"
route = "native"
driver = "xhcid"
stage = "rootfs"

[[device]]
id = "tpm"
name = "Optional TPM CRB with swtpm"
bus = "platform"
route = "native"
driver = "tpmd"
stage = "rootfs"
needs = ["tpm-check-service"]

