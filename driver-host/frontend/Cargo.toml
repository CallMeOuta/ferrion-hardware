# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "ferrion-frontend"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
common = { path = "../../drivers/common" }
daemon = { path = "../base/daemon" }
driver-graphics = { path = "../../drivers/graphics/driver-graphics" }
pcid = { path = "../../drivers/pcid" }
drm-sys = "0.8.1"
libc = "0.2.181"
libredox = "0.2.0"
log = "0.4"
redox_event = "0.5.0"
redox_syscall = { version = "0.9.5", features = ["std"] }

[patch."https://github.com/CallMeOuta/FerrionOS.git"]
daemon = { path = "../base/daemon" }
graphics-ipc = { path = "../base/graphics-ipc" }
inputd = { path = "../base/inputd" }
redox-ioctl = { path = "../relibc/redox-ioctl" }
scheme-utils = { path = "../base/scheme-utils" }

[profile.release]
panic = "abort"
